<!doctype html>
<!-- Imperium Gzowianskie board game: renders the plot diorama to a transparent PNG for the printed board. -->
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Działka do druku</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js"}}</script>
<style>html,body{margin:0;background:#bfe6f5}canvas{display:block;width:100vw}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three'
import { buildScene, isoCamera } from './scena.mjs'
import { buildIcon, ICONS } from './ikony.mjs'
const canvas = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true })
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.setClearColor(0x000000, 0)
const ASPECT = 1.44
const scene = buildScene(), camera = isoCamera(ASPECT)
window.renderPNG = width => { renderer.setPixelRatio(1); renderer.setSize(width, Math.round(width / ASPECT), false); renderer.render(scene, camera); return canvas.toDataURL('image/png') }
window.renderIcon = (name, size) => { const i = buildIcon(name); renderer.setPixelRatio(1); renderer.setSize(size, size, false); renderer.render(i.scene, i.camera); return canvas.toDataURL('image/png') }
window.iconNames = Object.keys(ICONS)
window.renderTokens = async width => {
  const data = await (await fetch('zetony.json')).json()
  const scene = new THREE.Scene()
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb9a98a, 1.15))
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.4)
  sun.position.set(-60, 110, 70)
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -140, right: 140, top: 140, bottom: -140, near: 1, far: 400 })
  sun.shadow.bias = -.0004
  sun.shadow.normalBias = .05
  scene.add(sun)
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshLambertMaterial({ color: '#fff0cf' }))
  ground.rotation.x = -Math.PI / 2
  ground.receiveShadow = true
  scene.add(ground)
  const g = new THREE.Group()
  scene.add(g)
  const put = (key, x, z, ry = 0) => {
    const t = data.find(d => d.key === key), geo = new THREE.BufferGeometry()
    geo.setAttribute('position', new THREE.Float32BufferAttribute(t.verts.flatMap(v => [v[0], v[2], -v[1]]), 3))
    geo.setIndex(t.tris.flat())
    const flat = geo.toNonIndexed()
    flat.computeVertexNormals()
    const m = new THREE.Mesh(flat, new THREE.MeshLambertMaterial({ color: t.colour, flatShading: true }))
    m.position.set(x, 0, z)
    m.rotation.y = ry
    m.castShadow = m.receiveShadow = true
    g.add(m)
  }
  put('szyszka1', -92, 22); put('szyszka1', -78, 30, 1); put('szyszka5', -58, 24); put('szyszka10', -34, 24)
  put('drewno', -4, 30, .3); put('drewno', -6, 16, -.2); put('piasek', 26, 24, .4); put('ryby', 56, 28, .5); put('ryby', 60, 12, -.3); put('niewypal', 90, 24, .6)
  put('domek', -62, -22, .35); put('domek', -38, -30, -.2); put('dom', 2, -26, .3); put('dom', 44, -28, -.25); put('domek', 78, -24, .5)
  const e = THREE.MathUtils.degToRad(33), a = .5, d = 300, aspect = 2
  const camera = new THREE.OrthographicCamera(-118, 118, 59, -59, 1, 800)
  camera.position.set(Math.sin(a) * Math.cos(e) * d, Math.sin(e) * d + 6, Math.cos(a) * Math.cos(e) * d)
  camera.lookAt(0, 6, 0)
  renderer.setPixelRatio(1)
  renderer.setSize(width, Math.round(width / aspect), false)
  renderer.render(scene, camera)
  return canvas.toDataURL('image/png')
}
window.renderPNG(1024)
window.ready = true
</script>
</body>
</html>
